services:
  app:
    build:
      context: .
      target: development
    command: bun run src/index.ts
    ports:
      - "${HOST_PORT:-3000}:3000"
    environment:
      NODE_ENV: development
      PORT: "3000"
    env_file:
      - .env
    volumes:
      - .:/app
      - app_node_modules:/app/node_modules
    depends_on:
      redis:
        condition: service_healthy
        required: false
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "fetch('http://localhost:3000/ready').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3

  redis:
    image: redis:7-alpine
    profiles:
      - redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 3

volumes:
  app_node_modules:
  redis_data:
