services:
  app:
    image: ${APERIO_IMAGE:-aperio-agent:latest}
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - ${APERIO_ENV_FILE:-.env.production}
    environment:
      NODE_ENV: production
      PORT: "3000"
    depends_on:
      redis:
        condition: service_healthy
        required: false
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "fetch('http://localhost:3000/ready').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3

  redis:
    image: redis:7-alpine
    profiles:
      - redis
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 3

volumes:
  redis_data:
